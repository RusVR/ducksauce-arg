<!DOCTYPE html>
<html>
<head>
    <title>Ducksauce</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        #duck {
            position: absolute;
            width: 120px;
            height: auto;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            will-change: transform;
        }
    </style>
</head>

<body>

    <img id="duck" src="Ducksauce.png">

    <script>
        const duck = document.getElementById("duck");

        const radiusX = 100;
        const radiusY = 55;
        const speed = 0.025;

        let t = 0;

        function animate() {
            // Smooth infinity / figure-8 curve
            const x = Math.sin(t) * radiusX;
            const y = Math.sin(t * 2) * radiusY;

            duck.style.transform =
                `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

            t += speed;

            requestAnimationFrame(animate);
        }

        animate();
    </script>

</body>
</html>
