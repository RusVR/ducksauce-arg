<!DOCTYPE html>
<html>
<head>
    <title>Ducksauce</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        #container {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
        }

        #duck {
            position: absolute;
            width: 120px;
            height: auto;
            left: 0;
            top: 0;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 2;
            user-select: none;
        }

        .trail {
            position: absolute;
            width: 120px;
            height: auto;
            left: 0;
            top: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
            animation: fadeTrail 1.2s linear forwards;
        }

        #message {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-family: Arial, sans-serif;
            font-size: 40px;
            color: black;
            display: none;
            z-index: 10;
        }

        @keyframes fadeTrail {
            from {
                opacity: 0.5;
            }

            to {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div id="container">
        <img id="duck" src="Ducksauce.png">
    </div>

    <div id="message">Homer Simpson</div>

    <script>
        const duck = document.getElementById("duck");
        const container = document.getElementById("container");
        const message = document.getElementById("message");

        const radiusX = 100;
        const radiusY = 55;
        const speed = 0.025;

        let t = 0;
        let lastTrail = 0;

        if (localStorage.getItem("ducksauce13") === "true") {
            localStorage.removeItem("ducksauce13");

            message.style.display = "block";

            setTimeout(() => {
                message.style.display = "none";
            }, 900);
        }

        duck.addEventListener("click", () => {
            let clicks = Number(localStorage.getItem("ducksauceClicks")) || 0;

            clicks++;

            if (clicks >= 13) {
                localStorage.setItem("ducksauce13", "true");
                localStorage.removeItem("ducksauceClicks");
            } else {
                localStorage.setItem("ducksauceClicks", clicks);
            }
        });

        function animate(time) {
            const x = Math.sin(t) * radiusX;
            const y = Math.sin(t * 2) * radiusY;

            duck.style.transform =
                `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

            if (time - lastTrail > 45) {
                const trail = document.createElement("img");

                trail.src = "Ducksauce.png";
                trail.className = "trail";

                trail.style.transform =
                    `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

                container.appendChild(trail);

                setTimeout(() => {
                    trail.remove();
                }, 1200);

                lastTrail = time;
            }

            t += speed;

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>

</body>
</html>
