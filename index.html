<!DOCTYPE html>
<html>
<head>
    <title>Ducksauce</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        #container {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
        }

        .duck {
            position: absolute;
            width: 120px;
            height: auto;
            left: 0;
            top: 0;
            transform: translate(-50%, -50%);
            will-change: transform;
            z-index: 2;
        }

        .trail {
            position: absolute;
            width: 120px;
            height: auto;
            left: 0;
            top: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
            animation: fadeTrail 1.2s linear forwards;
        }

        @keyframes fadeTrail {
            from {
                opacity: 0.5;
            }

            to {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div id="container">
        <img id="duck" class="duck" src="Ducksauce.png">
    </div>

    <script>
        const duck = document.getElementById("duck");
        const container = document.getElementById("container");

        const radiusX = 100;
        const radiusY = 55;
        const speed = 0.025;

        let t = 0;
        let lastTrail = 0;

        function animate(time) {

            const x = Math.sin(t) * radiusX;
            const y = Math.sin(t * 2) * radiusY;

            duck.style.transform =
                `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

            // Create a new trail copy
            if (time - lastTrail > 45) {

                const trail = document.createElement("img");

                trail.src = "Ducksauce.png";
                trail.className = "trail";

                trail.style.transform =
                    `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

                container.appendChild(trail);

                // Remove after fading
                setTimeout(() => {
                    trail.remove();
                }, 1200);

                lastTrail = time;
            }

            t += speed;

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>

</body>
</html>
